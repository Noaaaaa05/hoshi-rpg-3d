<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Hoshi Asset Workshop — 非公開レビュー</title><link rel="stylesheet" href="review.css"></head>
<body><header><span class="brand">HOSHI / ASSET WORKSHOP</span><span class="private">非公開 · 制作候補</span><h1>森をつくる、素材の台帳。</h1><p>切り抜きと分類を確認し、権利の根拠を記録します。この画面からAPI実行・公開はできません。</p><div id="summary" aria-live="polite"></div></header>
<main><section class="toolbar" aria-label="絞り込み"><label>検索<input id="search" type="search" placeholder="名前・ID・元画像"></label><label>分類<select id="category"><option value="">すべての分類</option></select></label><label>元画像<select id="source"><option value="">すべての画像</option></select></label><label>品質<select id="flag"><option value="">すべての候補</option><option value="low_resolution">低解像度</option><option value="duplicate">重複候補</option><option value="edge">端で欠けている可能性</option><option value="watermark_present">透かしあり</option><option value="empty_cell">空のセル</option><option value="merged_or_scene_review">複数物体・シーンの可能性</option><option value="approved">目視確認済み</option></select></label><button id="export">確認内容をJSONで保存</button></section>
<p id="notice" role="status">分類はシート名・領域のルールによる仮分類です。物体の正体・権利・欠損の自動判定は保証しません。</p><nav class="pagination"><button id="previous">前へ</button><span id="count"></span><button id="next">次へ</button></nav><section id="grid" aria-label="素材一覧"></section><section><h2>元画像と検出の範囲</h2><div id="sources"></div></section></main>
<dialog id="editor"><form method="dialog"><button class="close" aria-label="閉じる">×</button></form><h2 id="asset-title"></h2><img id="asset-preview" alt="選択した切り抜き"><p id="asset-info"></p><p id="asset-flags"></p><label>表示名<input id="edit-name"></label><label>分類<select id="edit-category"></select></label><fieldset><legend>切り抜き補正（元画像のx1,y1,x2,y2）</legend><div class="coordinates"><input id="x1" type="number" aria-label="x1"><input id="y1" type="number" aria-label="y1"><input id="x2" type="number" aria-label="x2"><input id="y2" type="number" aria-label="y2"></div><small>補正はJSONへ保存し、抽出コマンドの --corrections で再処理します。</small></fieldset><label>切り抜き・分類の確認<select id="edit-quality"><option value="pending">未確認</option><option value="approved">目視確認済み</option><option value="rejected">不採用</option></select></label><label>権利<select id="edit-rights"><option value="unknown">不明・利用停止</option><option value="cleared">許諾の根拠を確認済み</option><option value="blocked">利用不可</option></select></label><label>ライセンス／許諾の根拠<textarea id="edit-evidence" placeholder="契約・ライセンスのURL、作者、許可の範囲など"></textarea></label><label>確認者<input id="edit-reviewer"></label><label class="check"><input type="checkbox" id="edit-derivatives">3D化・Meshyへの送信が許諾範囲に含まれる</label><label class="check"><input type="checkbox" id="edit-publish">加工後のモデルの公開が許諾範囲に含まれる</label><button id="save-review">この素材の確認内容を保存</button><p id="edit-message" role="status"></p><a id="source-link" target="_blank" rel="noopener">原画像を確認する</a></dialog>
<script type="application/json" id="catalog">__CATALOG_JSON__</script><script src="review.js"></script></body></html>
