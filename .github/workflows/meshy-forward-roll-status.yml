name: Meshy forward roll status (FREE GET only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check existing task status (single GET; zero credits)
        run: node scripts/meshy/check-forward-roll-status.mjs
