name: Meshy existing task (free)
on:
  push:
    branches: ['workbench/meshy-existing-task-verification']
    paths: ['.github/workflows/meshy-existing-task.yml']
permissions:
  contents: read
jobs:
  retrieve:
    if: github.repository == 'Noaaaaa05/hoshi-rpg-3d' && github.ref_name == 'workbench/meshy-existing-task-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve the existing Meshy task
        env:
          TASK_KIND: motion
          TASK_ID: 01a1e4b0-d14f-73d6-ab4e-9ff7c372edf1
          DOWNLOAD: 'true'
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          set -euo pipefail
          args=("$TASK_KIND" "$TASK_ID")
          if [ "$DOWNLOAD" = true ]; then args+=("$RUNNER_TEMP/meshy-existing-task"); fi
          node scripts/meshy/retrieve-task.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Store the asset and sanitized task metadata
        uses: actions/upload-artifact@v4
        with:
          name: meshy-existing-task
          path: ${{ runner.temp }}/meshy-existing-task/
          retention-days: 1
          if-no-files-found: error
