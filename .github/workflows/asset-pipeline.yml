name: Asset pipeline checks
on:
  pull_request:
    paths: ['tools/asset_pipeline/**', 'scripts/assets/**', 'config/asset-sheets.json', 'tests/assets/**', 'tests/bulk-assets.test.mjs', '.github/workflows/asset-pipeline.yml', 'package.json']
  push:
    branches: ['codex/bulk-asset-pipeline']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r tools/asset_pipeline/requirements.txt
      - run: npm ci
      - run: npm run assets:test
      - name: Build only our synthetic test sheet and private review UI fixture
        run: python tests/assets/fixture.py --output work/assets-browser
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test -c tests/assets/playwright.config.mjs
      - name: Never upload source sheets, crops, private reviews or generated GLBs
        if: always()
        run: echo 'Only synthetic fixtures were used. Real user image results are never uploaded by this workflow.'
